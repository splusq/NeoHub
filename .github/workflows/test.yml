name: Test

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Same SDK image and digest as the Dockerfile's build stage; keep the two in sync.
    container: mcr.microsoft.com/dotnet/sdk:10.0@sha256:de4fe90a98845d75910b9769662465c84de1a934665c431279d1382b2bddc02b

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: TLink tests
        run: dotnet test NeoHub/TLink.Tests/DSC.TLink.Tests.csproj -c Release --blame-hang-timeout 60s

      - name: NeoHub tests
        run: dotnet test NeoHub/NeoHub.Tests/NeoHub.Tests.csproj -c Release --blame-hang-timeout 60s
