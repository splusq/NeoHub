version: '3.8'

services:
  neohub:
    image: ghcr.io/splusq/neohub:latest
    container_name: neohub
    ports:
      - "8080:8080"
      - "8443:8443"
      - "3072:3072"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - EnableHttps=false
    volumes:
      - ./persist:/app/persist
    restart: unless-stopped